name: Feature request
description: Suggest an idea or improvement.
labels: ['enhancement']
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of this repository would the change affect?
      options:
        - bytehound-opc-da-client (library)
        - opc-cli (TUI)
        - Both / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: A clear description of the problem or limitation you're running into.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >-
        What you'd like to happen. For library changes, sketch the API you have in mind if you
        can.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false
