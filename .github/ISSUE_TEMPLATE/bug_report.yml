name: Bug report
description: Report something that isn't working as expected.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for taking the time to report a bug. Please do not report security vulnerabilities
        here; use this repository's private vulnerability reporting (Security tab) instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of this repository is affected?
      options:
        - bytehound-opc-da-client (library)
        - opc-cli (TUI)
        - Both / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: >-
        A clear description of the bug, including any error message, HRESULT, or hint text that
        was shown.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >-
        Exact steps, commands, or code used. For the TUI, include the screens visited and the keys
        pressed. For the library, a minimal code snippet is ideal.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        Output of `opc-cli --version` and/or the bytehound-opc-da-client version from your
        Cargo.toml or Cargo.lock. Include the git commit if built from source, and which release
        bundle was used (modern x64 or Windows 7 legacy), if any.
    validations:
      required: true
  - type: input
    id: opc-server
    attributes:
      label: OPC DA server
      description: >-
        Vendor, product, and version of the OPC DA server involved, if relevant (e.g. Kepware
        KEPServerEX 6.x, Matrikon OPC Simulation Server).
    validations:
      required: false
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: >-
        Windows edition and version where the issue occurs (e.g. Windows 11 23H2, Windows Server
        2019, Windows 7 SP1). For build-only issues, the host OS instead.
    validations:
      required: false
  - type: dropdown
    id: bitness
    attributes:
      label: Process bitness
      description: Bitness of the process that runs the TUI or your application using the library.
      options:
        - 64-bit
        - 32-bit
        - Not sure / not applicable
    validations:
      required: false
  - type: dropdown
    id: connection
    attributes:
      label: Connection type
      description: Is the OPC DA server on the same machine, or reached remotely over DCOM?
      options:
        - Local (same machine)
        - Remote (DCOM)
        - Not sure / not applicable
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >-
        The TUI writes daily `opc-cli.log.<date>` files to a `logs` directory under the directory
        it was started from. Re-run with `-v` (debug) or `-vv` (trace), or set `RUST_LOG`, for more
        detail. For library issues, include your application's tracing output. Redact hostnames,
        usernames, and credentials before posting.
      render: shell
    validations:
      required: false
