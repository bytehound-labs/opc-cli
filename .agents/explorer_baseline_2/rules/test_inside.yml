id: test-inside
message: Found unwrap outside tests
severity: error
language: rust
files:
  - "sample_tests.rs"
rule:
  pattern: $X.unwrap()
  not:
    inside:
      stopBy: end
      any:
        - kind: mod_item
          follows:
            any:
              - pattern: "#[cfg(test)]"
              - pattern: "#[cfg(all(test, $$$))]"
        - kind: function_item
          follows:
            any:
              - pattern: "#[test]"
              - pattern: "#[tokio::test]"
              - pattern: "#[core::prelude::v1::test]"
