# cargo-deny configuration. `cargo deny check` runs in CI (see
# .github/workflows/ci.yml) and fails on a security advisory, a banned
# dependency, or a license that is not on the allow-list below.
#
# Most of this workspace's dependency graph is Windows-only (the COM/OPC DA
# `windows` crates are gated behind `cfg(windows)`), but the check itself runs
# on Linux. Listing the Windows targets explicitly makes cargo-deny resolve and
# audit those target-specific dependencies instead of silently skipping them.
[graph]
targets = [
  "x86_64-pc-windows-msvc",
  # The OPC DA gateway that consumes bytehound-opc-da-client is a 32-bit build.
  "i686-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
ignore = [
  # anyhow 1.0.101: `Error::downcast_mut()` is unsound. Neither workspace crate
  # calls `downcast_mut`, and anyhow >= 1.0.103 fixes it. TEMPORARY: the
  # `cargo update -p anyhow` lockfile bump is deferred until in-flight branches
  # that also edit Cargo.lock have landed; drop this entry with that bump.
  "RUSTSEC-2026-0190",
  # paste 1.0.15 is unmaintained. It is a compile-time-only proc-macro pulled in
  # transitively by ratatui 0.29 (opc-cli), with no safe upgrade path yet.
  # Revisit when ratatui is upgraded to a release that no longer depends on it.
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Every dependency, including transitive ones, must carry one of these
# permissive licenses. Widening this list should be a deliberate, reviewed
# decision rather than a reflex to unblock CI.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unlicense",
  "CC0-1.0",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
]
