id: require-safety-comment
message: "Unsafe blocks must have a preceding // SAFETY: comment explaining the safety rationale"
severity: error
language: rust
files:
  - "opc-da-client/src/**/*.rs"
ignores:
  - "**/tests/**"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/bindings/**"
rule:
  any:
    - kind: unsafe_block
    - pattern: "unsafe { $$$ }"
  not:
    inside:
      stopBy: end
      follows:
        any:
          - kind: line_comment
            regex: "SAFETY:"
          - kind: block_comment
            regex: "SAFETY:"
