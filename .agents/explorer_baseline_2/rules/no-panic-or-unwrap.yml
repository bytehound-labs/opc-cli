id: no-panic-or-unwrap
message: Prohibit unwrap, expect, panic, and todo in non-test library code
severity: error
language: rust
files:
  - "opc-da-client/src/**/*.rs"
ignores:
  - "**/tests/**"
  - "**/*_test.rs"
  - "**/*_tests.rs"
rule:
  any:
    - pattern: $X.unwrap()
    - pattern: $X.expect($$$ARGS)
    - pattern: panic!($$$ARGS)
    - pattern: todo!($$$ARGS)
  not:
    inside:
      stopBy: end
      any:
        - kind: mod_item
          follows:
            any:
              - pattern: "#[cfg(test)]"
              - pattern: "#[cfg(all(test, $$$))]"
        - kind: function_item
          follows:
            any:
              - pattern: "#[test]"
              - pattern: "#[tokio::test]"
              - pattern: "#[core::prelude::v1::test]"
