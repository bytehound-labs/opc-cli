[package]
name = "bytehound-opc-da-client"
authors.workspace = true
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Backend-agnostic OPC DA client library for Rust — async, trait-based, with transparent COM management"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["opc", "opc-da", "windows", "automation", "scada"]
categories = ["api-bindings", "network-programming"]

exclude = [
    ".winmd/",
    "rewrite.py",
]

[lib]
name = "opc_da_client"

[[example]]
name = "inventory-root"
required-features = ["opc-da-backend"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[lints]
workspace = true

[features]
default = ["opc-da-backend"]
opc-da-backend = []
test-support = ["dep:mockall"]
dev-diagnostics = []

[dependencies]
# Core (always included)
anyhow = { workspace = true }
async-trait = "0.1.86"
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# Test support: mock provider (optional)
mockall = { version = "0.13.1", optional = true }

[target.'cfg(windows)'.dependencies]
chrono = "0.4.43"
windows = { workspace = true }
windows-core = { workspace = true }

[dev-dependencies]
serde_json = "1.0"
